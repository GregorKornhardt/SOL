[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "sol-metric"
dynamic = ["version"]
description = "SOL: distributional text evaluation with double-sliced Wasserstein"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["numpy>=1.23.5"]
maintainers = [{name = "Gregor Kornhardt"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
torch = ["torch>=2.2.2"]
text = ["torch>=2.2.2", "transformers>=4.51.3,<5", "packaging>=20"]
dev = ["build>=1.2", "twine>=5", "ruff>=0.11,<1", "mypy>=1.15,<2", "cffconvert>=2"]

[project.urls]
Homepage = "https://github.com/GregorKornhardt/SOL"
Source = "https://github.com/GregorKornhardt/SOL"
Issues = "https://github.com/GregorKornhardt/SOL/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["sol_metric", "sol_metric.*"]

[tool.setuptools.dynamic]
version = {attr = "sol_metric._version.__version__"}

[tool.setuptools.package-data]
sol_metric = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
files = ["src/sol_metric"]
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*"]
follow_imports = "skip"
ignore_missing_imports = true
